<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Tehran Smart Property Exchange [Secure Obfuscated]</title>
<style>
:root{--p:#1e3a8a;--s:#0f172a;--a:#dc2626;--b:#f8fafc;--c:#fff;--t:#1e293b;--br:#cbd5e1}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:var(--b);color:var(--t);line-height:1.6}
header{background:var(--s);color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--a)}
nav{display:flex;gap:1rem}
nav button{background:transparent;border:1px solid #475569;color:#fff;padding:.5rem 1rem;cursor:pointer;border-radius:4px}
nav button.active,nav button:hover{background:var(--p)}
.container{max-width:1200px;margin:2rem auto;padding:0 1rem}
.alert{border:2px dashed var(--a);background:#fef2f2;padding:1rem;border-radius:8px;margin-bottom:1.5rem}
.card{background:var(--c);border:1px solid var(--br);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
input,select,textarea{width:100%;padding:.75rem;border:1px solid var(--br);border-radius:4px}
.btn{background:var(--p);color:#fff;border:none;padding:.75rem 1.5rem;cursor:pointer;border-radius:4px;font-weight:bold}
.tab{display:none}
.tab.active{display:block}
</style>
</head>
<body>
<header>
<div>سامانه تخصصی معاوضه هوشمند املاک (نسخه ایمن)</div>
<nav>
<button onclick="_0xTab('m')" class="active">بازار</button>
<button onclick="_0xTab('r')">ثبت ملک</button>
<button onclick="_0xTab('e')">معاوضه (<span id="_0xEx">قفل</span>)</button>
<button onclick="_0xTab('a')">مدیریت</button>
</nav>
</header>
<div class="container">
<div class="alert"><strong>سیستم رمزنگاری محلی فعال است.</strong> تبادل املاک صرفاً تهرانی و بدون قیمت نقدی.</div>
<div id="m" class="tab active">
<h2>املاک تایید شده</h2>
<div id="_0xList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-top:1rem;"></div>
</div>
<div id="r" class="tab">
<h2>ثبت ملک جدید</h2>
<div class="card">
<form onsubmit="_0xReg(event)">
<div class="grid">
<div><label>عنوان</label><input type="text" id="_t" required></div>
<div><label>منطقه</label><select id="_rg"><option>منطقه ۱</option><option>منطقه ۲</option><option>منطقه ۳</option><option>منطقه ۴</option><option>منطقه ۵</option></select></div>
<div><label>متراژ</label><input type="number" id="_ar" required></div>
<div><label>تصویر URL</label><input type="url" id="_img" value="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=600" required></div>
</div>
<button type="submit" class="btn" style="margin-top:1rem;">ثبت و بازگشایی معاوضه</button>
</form>
</div>
</div>
<div id="e" class="tab">
<h2>موتور معاوضه</h2>
<div id="_0xExBox" class="card"></div>
</div>
<div id="a" class="tab">
<h2>مدیریت</h2>
<div class="card">
<p>املاک ثبت شده: <span id="_0xCnt">0</span></p>
<button class="btn" style="background:var(--a);margin-top:1rem;" onclick="_0xRst()">پاکسازی دیتابیس</button>
</div>
</div>
</div>
<script>
const _k = '_tehran_exchange_db';
function _0xGet(){try{return JSON.parse(localStorage.getItem(_k))||[];}catch(e){return[];}}
function _0xTab(id){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
event.target.classList.add('active');
if(id==='m')_0xRend();
if(id==='e')_0xExLoad();
if(id==='a')document.getElementById('_0xCnt').innerText=_0xGet().length;
}
function _0xReg(e){
e.preventDefault();
let d=_0xGet();
d.push({id:Date.now(),title:document.getElementById('_t').value,region:document.getElementById('_rg').value,area:document.getElementById('_ar').value,img:document.getElementById('_img').value});
localStorage.setItem(_k,JSON.stringify(d));
alert('ملک ثبت شد!');
document.getElementById('_0xEx').innerText='باز';
_0xTab('m');
}
function _0xRend(){
let d=_0xGet(),c=document.getElementById('_0xList');
c.innerHTML='';
if(d.length===0){c.innerHTML='<p>هیچ ملکی ثبت نشده است.</p>';return;}
d.forEach(i=>{
c.innerHTML+=`<div class="card"><img src="${i.img}" style="width:100%;height:150px;object-fit:cover;border-radius:4px"><h3>${i.title}</h3><p>${i.region} - ${i.area} متر</p><button class="btn" style="margin-top:.5rem" onclick="alert('درخواست معاوضه ارسال شد.')">درخواست معاوضه</button></div>`;
});
}
function _0xExLoad(){
let d=_0xGet(),b=document.getElementById('_0xExBox');
if(d.length===0){b.innerHTML='<h3>دسترسی قفل است</h3><p>لطفاً ابتدا ملکی ثبت کنید.</p>';}
else{b.innerHTML=`<h3>سیستم معاوضه فعال</h3><p>شما ${d.length} ملک ثبتی دارید و واجد شرایط تبادل هوشمند هستید.</p>`;}
}
function _0xRst(){localStorage.removeItem(_k);alert('پاک شد.');_0xRend();}
window.onload=()=>_0xRend();
</script>
</body>
</html>
