        nav button.active { border-bottom-color: var(--primary); color: var(--primary); }
        .container { padding: 15px; max-width: 800px; margin: auto; }

        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        .btn-secondary { background: #757575; }
        .property-card { border-right: 5px solid var(--primary); }
